appId: studio.signal.sticker
productName: Signal Sticker Optimiser
copyright: MIT

directories:
  output: dist
  buildResources: build

files:
  - "!**/.vscode/*"
  - "!src/*"
  - "!scripts/*"
  - "!test/*"
  - "!plans/*"
  - "!examples/*"
  - "!{tsconfig.json,vitest.config.ts,eslint.config.mjs,.prettierrc*}"
  - "!resources/**"

asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/ffmpeg-static/**"

extraResources:
  - from: resources/onnx
    to: onnx
    filter:
      - "**/*"

linux:
  target:
    - AppImage
  category: Graphics
  maintainer: Signal Sticker Optimiser
  artifactName: signal-sticker-optimiser-${version}-linux-${arch}.${ext}
  extraResources:
    # ffmpeg-static names the binary after the host platform, so each platform copies its own
    - from: node_modules/ffmpeg-static/ffmpeg
      to: ffmpeg

win:
  target:
    - nsis
  artifactName: signal-sticker-optimiser-${version}-win-${arch}-setup.${ext}
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg.exe
      to: ffmpeg.exe

mac:
  target:
    - dmg
  extraResources:
    - from: node_modules/ffmpeg-static/ffmpeg
      to: ffmpeg
